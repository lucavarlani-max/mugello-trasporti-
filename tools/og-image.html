<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Anteprima social</title>
<style>
  @font-face { font-family: "Bricolage Grotesque"; font-weight: 800; src: url("../fonts/bricolage-grotesque-800.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../fonts/ibm-plex-mono-500.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    background: radial-gradient(120% 140% at 85% 20%, #2f5379 0%, #24405c 38%, #1b2a3c 100%);
    position: relative;
  }
  svg.map { position: absolute; inset: 0; }
  .content { position: absolute; left: 84px; top: 92px; width: 800px; }
  .lockup { display: flex; align-items: center; gap: 30px; }
  .mk { width: 120px; height: 120px; flex: none; }
  .mk svg { display: block; width: 100%; height: 100%; }
  .word { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 84px; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; color: #eaf2ec; }
  .word .sky { color: #67aef0; }
  .word small { display: block; margin-top: 14px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; font-size: 23px; letter-spacing: 0.16em; text-transform: uppercase; color: #adbcb2; }
  .sub { margin-top: 50px; font-size: 38px; line-height: 1.25; color: #d7e1ec; }
  .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { padding: 8px 20px; border-radius: 999px; font-size: 24px; font-weight: 600; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.28); }
  .domain { position: absolute; left: 84px; bottom: 40px; font-size: 28px; font-weight: 600; color: #f0c48f; letter-spacing: 0.3px; }
</style>
</head>
<body>
  <svg class="map" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
      <path d="M560 640C620 540 720 560 790 480S960 380 1060 300 1180 150 1230 80"/>
      <path d="M520 640C600 560 700 590 760 520S940 420 1040 350 1160 210 1230 150"/>
      <path d="M600 640C650 520 760 530 830 450S980 340 1080 250 1190 90 1230 20"/>
      <path d="M480 640C560 600 660 620 730 560S900 470 1000 410 1140 280 1230 220"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
      <path d="M1236 118C1150 150 1090 230 1010 262S860 310 800 392 700 520 640 646" stroke="#b23a48"/>
      <path d="M1236 300C1160 296 1110 350 1040 372S900 380 860 440 800 560 770 646" stroke="#1b6fa8"/>
      <path d="M1100 -10C1090 80 1040 120 990 170S930 280 880 322" stroke="#d68c45"/>
      <path d="M1236 470C1170 440 1120 470 1060 456S960 430 910 470" stroke="#1c7c54"/>
    </g>
    <g stroke="#1b2a3c" stroke-width="4">
      <circle cx="1010" cy="262" r="12" fill="#fff"/>
      <circle cx="800" cy="392" r="12" fill="#fff"/>
      <circle cx="1040" cy="372" r="11" fill="#fff"/>
      <circle cx="860" cy="440" r="11" fill="#fff"/>
      <circle cx="990" cy="170" r="11" fill="#fff"/>
      <circle cx="1060" cy="456" r="10" fill="#fff"/>
      <circle cx="1150" cy="150" r="10" fill="#fff"/>
      <circle cx="700" cy="520" r="10" fill="#fff"/>
    </g>
  </svg>

  <div class="content">
    <div class="lockup">
      <span class="mk"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M2 16 L10 7 L17 13 L26 4 L38 16" stroke="#3ba883" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 34 C11 26 15 36 21 30.5 C27 25 31 32 35 26" stroke="#67aef0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="5" cy="34" r="2.4" fill="#1b2a3c" stroke="#67aef0" stroke-width="1.8"/>
        <circle cx="21" cy="30.5" r="2.4" fill="#1b2a3c" stroke="#67aef0" stroke-width="1.8"/>
        <circle cx="35.5" cy="25.5" r="3.2" fill="#e0975a" stroke="#1b2a3c" stroke-width="1.4"/>
      </svg></span>
      <div class="word">Mugello<span class="sky">trasporti</span><small>Bus &middot; treni &middot; orari della vallata</small></div>
    </div>
    <div class="sub">Treni e autobus del Mugello,<br>Alto Mugello e Val di Sieve</div>
    <div class="chips">
      <span class="chip">Mappa interattiva</span>
      <span class="chip">Orari</span>
      <span class="chip">Percorsi</span>
      <span class="chip">Ritardi treni</span>
    </div>
  </div>
  <div class="domain">www.mugellotrasporti.it</div>
</body>
</html>
